# Sitenin sunucuda nereye kopyalanacağı. Bu dosya değişip GitHub'a gönderilince
# bir sonraki cron çalışmasında yeni ayar geçerli olur.
#
# HEDEF : ev dizinine ($HOME) göre klasör
#         demo için : demo.vanterm.com   (cPanel'de alt alan adının Document Root'u)
#         canlı için: public_html
# MOD   : demo  -> arama motorlarına kapalı (robots.txt engeli + noindex başlığı),
#                  cPanel "Directory Privacy" ile şifre konduysa şifre korunur
#         canli -> normal yayın

# HTTPS : evet  -> tüm istekler HTTPS'e yönlendirilir (canlıda her zaman evet)
#         hayir -> HTTPS yönlendirmesi ve HSTS çıkarılır (yalnızca demo için; SSL sertifikası gelene kadar)

HEDEF="public_html"
MOD="canli"
HTTPS="evet"
